name: contributor agreement

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  agreement:
    runs-on: ubuntu-latest
    steps:
      - name: Check the agreement box is ticked
        env:
          BODY: ${{ github.event.pull_request.body }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          case "$ASSOCIATION" in
            OWNER|MEMBER) echo "Maintainer pull request: no agreement needed."; exit 0 ;;
          esac
          if printf '%s' "$BODY" | grep -Eiq '\[x\] I agree to the contributor agreement'; then
            echo "Contributor agreement accepted."
          else
            echo "::error::Please tick 'I agree to the contributor agreement' in the pull request description. See CONTRIBUTING.md."
            exit 1
          fi
