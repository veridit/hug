name: ci

on:
  push:
    branches: [main, "ci/**"] # ci/<task-id>: check a fix on every OS before main
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No-secrets gate (whole repository)
        run: ./muninn/scripts/check-secrets.sh --all

  test:
    needs: secrets
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        # The race detector runs once, on ubuntu (fastest); macOS and Windows
        # run plain tests for platform behaviour. -race made windows ~14 min.
        run: go test ${{ matrix.os == 'ubuntu-latest' && '-race' || '' }} ./...
        env:
          CGO_ENABLED: "1"
      - name: Build hug (pure Go)
        run: go build ./cmd/hug
        env:
          CGO_ENABLED: "0"
