name: ci

on:
  push:
    branches: [main, "ci/**"] # ci/<task-id>: check a fix on every OS before main
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No-secrets gate (whole repository)
        run: ./muninn/scripts/check-secrets.sh --all

  test:
    needs: secrets
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        # The race detector runs once, on ubuntu (fastest); macOS and Windows
        # run plain tests for platform behaviour. -race made windows ~14 min.
        # Windows tests huginn/internal/cli in its own job (test-windows-cli):
        # beside 30 packages on one 4-CPU runner its time measured the
        # runner's load, 323 s and 407 s for one tree (runs 44204301242,
        # 44206328950; 0sbvnq, crab 2026-11-18).
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = windows-latest ]; then
            go test $(go list ./... | grep -vx 'github.com/veridit/hug/huginn/internal/cli')
          else
            go test ${{ matrix.os == 'ubuntu-latest' && '-race' || '' }} ./...
          fi
        env:
          CGO_ENABLED: "1"
      - name: Build hug (pure Go)
        run: go build ./cmd/hug
        env:
          CGO_ENABLED: "0"

  test-windows-cli:
    # huginn/internal/cli on Windows, alone on its runner, beside the test
    # job: same tests, no skips; its time is its own (0sbvnq).
    needs: secrets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test huginn/internal/cli
        # MEASURE (0n4rnx, branch only, never lands): per-test times as JSON.
        # -timeout 20m only so the measurement completes; the bar is 300 s.
        shell: bash
        run: |
          mkdir -p $RUNNER_TEMP/tr
          GIT_TRACE2_EVENT=$RUNNER_TEMP/tr ZZ_SAMPLE=$PWD/sample.tsv go test -json -timeout 20m ./huginn/internal/cli/ > cli.json || true
          go run ./scripts/testtimes cli.json 40
          echo '== goroutine-seconds per test, by state (100 ms samples): test exec sleep lock run'
          awk -F'\t' '{s[$1,$2]+=$3/10; t[$1]=1} END{for(k in t) printf "%s\t%.1f\t%.1f\t%.1f\t%.1f\n", k, s[k,"exec"], s[k,"sleep"], s[k,"lock"], s[k,"run"]}' sample.tsv | sort -t$'\t' -k2 -rn | head -30
          go run ./scripts/testsplit $RUNNER_TEMP/tr > split.tsv
          echo "git processes: $(ls $RUNNER_TEMP/tr | wc -l)"
          head -40 split.tsv
        env:
          CGO_ENABLED: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wincli-json
          path: |
            cli.json
            split.tsv
            sample.tsv

  bench:
    # Benchmarks out of the normal suite (Jørgen, 2026-11-17 10:00): one
    # ubuntu runner, no -race, beside the test jobs and required like them.
    # Each benchmark compares the new path with the old one in the same
    # process (a ratio, never an absolute time: runners differ 2-10x, CI
    # runs 44054586997 and 44057678727). Tests skip them without HUG_BENCH=1.
    needs: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Benchmarks (HUG_BENCH=1)
        run: go test -count=1 -v -timeout 30m -run 'Bench' ./...
        env:
          HUG_BENCH: "1"
