name: exp-6ep7y2
# Branch-only experiment E3 for 6ep7y2 (H3: a network-class git call to a
# local bare remote occasionally hangs on Windows until NetTimeout). Never
# lands on main.
on:
  push:
    branches: ["ci/6ep7y2-*"]
permissions:
  contents: read
jobs:
  e3:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build test binaries
        shell: bash
        run: |
          go test -c -o cli.test.exe ./huginn/internal/cli/
          go test -c -o gb.test.exe ./huginn/gitbranch/
      - name: Net ops beside the full cli package
        shell: bash
        run: |
          (cd huginn/internal/cli && ../../../cli.test.exe -test.timeout 40m > ../../../full.log 2>&1) &
          full=$!
          (cd huginn/gitbranch && EXP_6EP7Y2=1 EXP_6EP7Y2_FOR=8m ../../gb.test.exe -test.v -test.timeout 30m -test.run '^TestExp6ep7y2NetOps$' > ../../e3.log 2>&1) &
          e3=$!
          wait $e3; x=$?
          wait $full; f=$?
          echo "e3 exit $x, full exit $f"
          grep -E 'E3 |--- (PASS|FAIL)' e3.log
          tail -3 full.log
          grep -n -A80 'still running after 30 s' full.log || echo "no stall"
          exit $((x|f))
