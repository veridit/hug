name: exp-6ep7y2
# Branch-only experiment E2 for 6ep7y2 (H2: a pass holds the run lock inside
# one phase; which one). Never lands on main.
on:
  push:
    branches: ["ci/6ep7y2-*"]
permissions:
  contents: read
jobs:
  e2:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build test binary
        shell: bash
        run: go test -c -o cli.test.exe ./huginn/internal/cli/
      - name: Full package beside amplified sync tests
        shell: bash
        run: |
          cd huginn/internal/cli
          ../../../cli.test.exe -test.timeout 40m > ../../../full.log 2>&1 &
          full=$!
          ../../../cli.test.exe -test.timeout 40m -test.count 6 -test.parallel 8 -test.run 'TestBackgroundSync(BurstIsBatched|ParallelNotesAllLand|NoteReachesOtherClone|OfflineCatchesUp)$|TestSettledWaitsForSlowChild$' > ../../../amp.log 2>&1 &
          amp=$!
          wait $full; f=$?
          wait $amp; a=$?
          echo "full exit $f, amp exit $a"
          echo "=== full.log tail"; tail -5 ../../../full.log
          echo "=== amp.log tail"; tail -5 ../../../amp.log
          echo "=== stalls"; grep -n -A80 'still running after 30 s' ../../../full.log ../../../amp.log || echo "no stall"
          echo "=== FAIL lines"; grep -n -- '--- FAIL' ../../../full.log ../../../amp.log || echo "no FAIL"
          exit $((f|a))
