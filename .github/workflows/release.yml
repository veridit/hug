name: release

# A tag vX.Y.Z releases hug: one binary that is also muninn and huginn.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: No-secrets gate
        run: ./muninn/scripts/check-secrets.sh --all
      - name: Test
        # A tag releases a SHA CI already passed: the wall-clock budget tests
        # skip here (HUG_SKIP_TIMING=1, internal/timing), so a loaded runner
        # cannot fail a release on speed. CI judges them (khq1fq: v0.7.113,
        # run 45627554531, TestBigTaskKeys p50 53.8 ms over 50 ms after CI
        # 45625116019 passed). -v only to list those skips: a pass prints
        # each package's line and the skipped budgets, a failure the whole log.
        shell: bash
        run: |
          log="$RUNNER_TEMP/test.log"
          go test -v ./... > "$log" 2>&1 && ok=0 || ok=$?
          if [ "$ok" = 0 ]; then
            grep -E '^(ok|FAIL|\?) ' "$log"
            grep 'skipped under HUG_SKIP_TIMING=1' "$log" || true
            echo "wall-clock budget tests skipped: $(grep -c 'skipped under HUG_SKIP_TIMING=1' "$log")"
          else
            cat "$log"
          fi
          exit "$ok"
        env:
          HUG_SKIP_TIMING: "1"
      - name: Build all platforms
        run: ./scripts/build-release.sh "${GITHUB_REF_NAME}"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "hug ${GITHUB_REF_NAME}"
      - name: Update Homebrew formulas and Scoop manifest
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          trap 'rm -f ~/.ssh/tap' EXIT
          mkdir -p ~/.ssh && printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap && chmod 600 ~/.ssh/tap
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:veridit/homebrew-tap.git tap
          ./scripts/package-managers.sh "${GITHUB_REF_NAME}" dist/SHA256SUMS tap
          cd tap
          git config user.name "hug release"
          git config user.email "hug-release@users.noreply.github.com"
          git add Formula/hug.rb Formula/muninn.rb Formula/huginn.rb bucket/hug.json
          git diff --cached --quiet || git commit -m "hug ${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            git pull --rebase
            if git push origin HEAD; then exit 0; fi
          done
          exit 1
